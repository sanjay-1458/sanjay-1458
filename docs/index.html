  <script>
    (() => {
      'use strict';
      const projects = {
        volo: { name:'VoloNexus.AI', repo:'VoloNexus.AI', desc:'Autonomous scheduling across email and calendars', fallback:'# VoloNexus.AI\n\n> Autonomous AI scheduling system\n\nAI agents read emails, understand meeting intent, resolve calendar conflicts, and sync events across Google accounts.\n\n## Stack\n- NestJS · Next.js · MongoDB\n- Pinecone · Redis · Gemini\n\n## View full README\nOpen the GitHub repository with the Repo button.' },
        lenny: { name:'the-lenny-growth-assistant', repo:'the-lenny-growth-assistant', desc:'Self-hosted AI growth assistant', fallback:'# The Lenny Growth Assistant\n\n> AI-powered growth assistant\n\nRuns in Docker with a FastAPI backend, PostgreSQL + pgvector, and local Ollama models.\n\n## Stack\n- FastAPI · PostgreSQL · pgvector\n- Docker · Ollama\n\n## View full README\nOpen the GitHub repository with the Repo button.' },
        jobs: { name:'Job-Finder', repo:'Job-Finder', desc:'Multi-ATS job ingestion with LLM filtering', fallback:'# Job-Finder\n\n> AI job finder and referral automation\n\nCollects roles from Greenhouse, Lever and Workday, normalizes listings, and applies deterministic rules and LLM filtering.\n\n## Stack\n- Python · FastAPI · PostgreSQL\n- Redis · WebSockets · LLMs\n\n## View full README\nOpen the GitHub repository with the Repo button.' },
        design: { name:'System-Design', repo:'System-Design', desc:'High-level and low-level system design', fallback:'# System Design Repository\n\n> System design patterns and real-world design problems\n\nExplore high-level system design, distributed systems, and low-level OOD solutions using C++.\n\n## Topics\n- HLD · Scalability · Reliability\n- LLD · Design patterns · C++\n\n## View full README\nOpen the GitHub repository with the Repo button.' }
      };
      const $ = (id) => document.getElementById(id);
      const tabsEl=$('tabs'), editor=$('editor'), state=$('state'), openRepo=$('openrepo');
      let openTabs=[], current=null;
      const cache=new Map();
      const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
      const repoURL=(id)=>'https://github.com/sanjay-1458/'+projects[id].repo;
      function setState(msg){state.textContent=msg}
      function setFolder(button, container, expanded){
        button.setAttribute('aria-expanded',String(expanded));container.hidden=!expanded;
        const arrow=button.querySelector('.arrow, .tree-arrow, .expand');if(arrow)arrow.textContent=expanded?'⌄':'›';
      }
      function showProjectFolder(id){
        const b=document.querySelector('.project[data-project="'+id+'"]');
        if(b)setFolder(b,$('files-'+id),true);
      }
      function revealProject(id){
        setFolder($('root-toggle'),$('root-tree'),true);
        setFolder($('projects-toggle'),$('projects-tree'),true);
        showProjectFolder(id);
      }
      function updateNav(){
        document.querySelectorAll('.project').forEach(b=>{const active=b.dataset.project===current;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'true':'false')});
        document.querySelectorAll('.readme-file').forEach(b=>{const active=b.dataset.readme===current;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'true':'false')});
      }
      function drawTabs(){ tabsEl.replaceChildren();for(const id of openTabs){ const p=projects[id]; const tab=el('div','tab'+(id===current?' active':''));tab.setAttribute('role','tab');tab.setAttribute('aria-selected',id===current?'true':'false');tab.tabIndex=0;
        const icon=el('span','md','M↓'),name=el('span','name',p.name),close=el('button','close','×');close.type='button';close.title='Close '+p.name;close.setAttribute('aria-label','Close '+p.name+' tab');close.addEventListener('click',(e)=>{e.stopPropagation();closeTab(id)});
        tab.append(icon,name,close);tab.addEventListener('click',()=>openProject(id));tab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProject(id)}});tabsEl.append(tab);}
      }
      function empty(){editor.replaceChildren();const d=el('div','empty'),logo=el('div','logo','◇'),title=el('strong','', 'No editors open'),hint=el('span','', 'Choose a project from the Explorer to open its README.md.');d.append(logo,title,hint);editor.append(d);$('crumb').textContent='projects';openRepo.href='https://github.com/sanjay-1458';setState('Ready');}
      function openProject(id){if(!projects[id])return;revealProject(id);if(!openTabs.includes(id))openTabs.push(id);current=id;updateNav();drawTabs();renderCurrent();}
      function closeTab(id){const i=openTabs.indexOf(id);if(i===-1)return;openTabs.splice(i,1);if(current===id)current=openTabs[Math.min(i,openTabs.length-1)]||null;updateNav();drawTabs();if(current)renderCurrent();else empty();}
      async function load(id){if(cache.has(id))return cache.get(id);const p=projects[id];setState('Fetching README.md from GitHub…');
        try {const url='https://raw.githubusercontent.com/sanjay-1458/'+encodeURIComponent(p.repo)+'/main/README.md';const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw new Error('HTTP '+resp.status);const markdown=await resp.text();if(!markdown.trim())throw Error('Empty README');cache.set(id,{text:markdown,remote:true});}
        catch(err){cache.set(id,{text:p.fallback,remote:false});}
        return cache.get(id);
      }
      function colorFor(line){if(/^\s*#{1,6}\s/.test(line))return 'head';if(/^\s*>/.test(line))return 'quote';if(/^\s*```/.test(line))return 'fence';if(/^\s*[-*+]\s/.test(line))return 'bullet';if(/https?:\/\//.test(line))return 'link';return '';}
      function drawSource(markdown){const code=el('div','code');const fragment=document.createDocumentFragment();const lines=markdown.replace(/\r\n/g,'\n').split('\n');const max=1400;for(let i=0;i<Math.min(max,lines.length);i++){const row=el('div','line');row.append(el('span','n',String(i+1)),el('span','l '+colorFor(lines[i]),lines[i]||' '));fragment.append(row)}if(lines.length>max){fragment.append(el('div','line','… More content available in the repository.'))}code.append(fragment);editor.replaceChildren(code);}
      // Render a safe Markdown preview without libraries or third-party APIs.
      function drawPreview(md, id){
        const box=el('div','preview');const lines=md.replace(/\r\n/g,'\n').split('\n');
        const repoBase='https://raw.githubusercontent.com/sanjay-1458/'+encodeURIComponent(projects[id].repo)+'/main/';
        const githubBase='https://github.com/sanjay-1458/'+encodeURIComponent(projects[id].repo)+'/blob/main/';
        function safeUrl(value,isImage){
          try{const url=new URL(value.trim(),isImage?repoBase:githubBase);return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}
        }
        function addImage(parent,src,alt){const url=safeUrl(src,true);if(!url)return;const image=el('img');image.src=url;image.alt=alt||'README illustration';image.loading='lazy';parent.append(image)}
        const token=/(!?\[([^\]]*)\]\(([^\s)]+)(?:\s+[^)]*)?\)|`([^`]+)`|\*\*([^*]+)\*\*|\*([^*]+)\*)/g;
        function inline(node,input){
          let last=0,match;token.lastIndex=0;
          while((match=token.exec(input))){
            if(match.index>last)node.append(document.createTextNode(input.slice(last,match.index)));
            if(match[2]!==undefined && match[3]!==undefined){
              if(match[1].startsWith('!'))addImage(node,match[3],match[2]);
              else{const href=safeUrl(match[3],false);if(href){const link=el('a','',match[2]);link.href=href;link.target='_blank';link.rel='noopener noreferrer';node.append(link)}else node.append(document.createTextNode(match[2]));}
            }else if(match[4])node.append(el('code','',match[4]));
            else if(match[5])node.append(el('strong','',match[5]));
            else if(match[6])node.append(el('em','',match[6]));
            last=token.lastIndex;
          }
          if(last<input.length)node.append(document.createTextNode(input.slice(last)));
        }
        function cells(line){return line.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'))}
        let code=null;
        for(let i=0;i<Math.min(1400,lines.length);i++){
          const raw=lines[i],line=raw.trim();
          if(line.startsWith('```')){
            if(code)code=null;else{const p=el('pre');code=el('code');p.append(code);box.append(p)}
            continue;
          }
          if(code){code.textContent+=raw+'\n';continue}
          if(!line)continue;
          const imageTag=/<img\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>/i.exec(line);
          if(imageTag){const alt=/<img\b[^>]*\balt\s*=\s*["']([^"']*)["']/i.exec(line);addImage(box,imageTag[1].replace(/&amp;/g,'&'),alt?.[1]||'README illustration');continue}
          const h=line.match(/^(#{1,6})\s+(.+)$/);
          if(h){const level=Math.min(h[1].length,3),node=el('h'+level);inline(node,h[2]);box.append(node);continue}
          if(/^(-{3,}|\*{3,})$/.test(line)){box.append(el('hr'));continue}
          if(line.includes('|') && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')){
            const table=el('table'),thead=el('thead'),first=el('tr');for(const cell of cells(line)){const th=el('th');inline(th,cell);first.append(th)}thead.append(first);table.append(thead);
            i+=1;const tbody=el('tbody');while(i+1<lines.length && lines[i+1].includes('|') && lines[i+1].trim()){i++;const tr=el('tr');for(const cell of cells(lines[i])){const td=el('td');inline(td,cell);tr.append(td)}tbody.append(tr)}table.append(tbody);box.append(table);continue;
          }
          if(/^([*-]|\d+\.)\s+/.test(line)){const n=el('li');inline(n,line.replace(/^([*-]|\d+\.)\s+/,''));box.append(n);continue}
          if(/^>\s?/.test(line)){const n=el('blockquote');inline(n,line.slice(1).trim());box.append(n);continue}
          // Never inject arbitrary HTML from the remote README.
          if(/^<\/?[a-z][^>]*>$/i.test(line))continue;
          const cleaned=line.replace(/<[^>]+>/g,'').trim();if(!cleaned)continue;
          const p=el('p');inline(p,cleaned);box.append(p);
        }
        box.append(el('p','note','Rendered README.md · Open Repo for the full GitHub version.'));
        editor.replaceChildren(box);
      }
      async function renderCurrent(){const id=current;if(!id)return;const p=projects[id];$('crumb').textContent='';$('crumb').append(document.createTextNode('projects  ›  '+p.name+'  ›  '),el('b','', 'README.md'));openRepo.href=repoURL(id);
        const known=cache.get(id);if(known){drawPreview(known.text,id);setState(known.remote?'README.md · GitHub source':'Offline preview · Full README on GitHub');editor.scrollTop=0;return}
        drawPreview('# '+p.name+'\n\n> Loading the public README.md…',id);editor.scrollTop=0;
        const result=await load(id);if(current!==id)return;drawPreview(result.text,id);setState(result.remote?'README.md · GitHub source':'Offline preview · Full README on GitHub');editor.scrollTop=0;
      }
      $('root-toggle').addEventListener('click',()=>{const b=$('root-toggle');setFolder(b,$('root-tree'),b.getAttribute('aria-expanded')!=='true')});
      $('projects-toggle').addEventListener('click',()=>{const b=$('projects-toggle');setFolder(b,$('projects-tree'),b.getAttribute('aria-expanded')!=='true')});
      document.querySelectorAll('.project').forEach(b=>b.addEventListener('click',()=>{
        const id=b.dataset.project;
        if(b.getAttribute('aria-expanded')==='true'){setFolder(b,$('files-'+id),false)}
        else openProject(id);
      }));
      document.querySelectorAll('.readme-file').forEach(b=>b.addEventListener('click',()=>openProject(b.dataset.readme)));
      document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='w'){e.preventDefault();if(current)closeTab(current)}else if((e.metaKey||e.ctrlKey)&&['1','2','3','4'].includes(e.key)){e.preventDefault();openProject(['volo','lenny','jobs','design'][Number(e.key)-1])}});
      // Render the first README by default. Project folders expand, tabs can be closed with ×.
      const selected = new URLSearchParams(window.location.search).get('project');
      openProject(selected && Object.hasOwn(projects, selected) ? selected : 'volo');
    })();
  </script>
