<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10141e" />
  <title>Sanjay Thakur · Projects — VS Code</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1019; --window:#10151f; --border:#27303e; --muted:#8392a8; --light:#d5deec; --cyan:#66d9ef; --purple:#bf9cfb; --green:#84dfb1; }
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 20% 4%,#18263c 0%,#0b1019 52%,#080c12 100%);color:var(--light);display:flex;align-items:center;justify-content:center;padding:30px}
    a{color:inherit;text-decoration:none} button{font:inherit} button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px;border-radius:4px}
    .window{width:min(1120px,100%);height:min(665px,calc(100vh - 60px));min-height:340px;display:flex;flex-direction:column;border:1px solid #354258;border-radius:13px;overflow:hidden;background:var(--window);box-shadow:0 26px 100px #000a,0 0 0 1px #fff1}
    .titlebar{height:43px;min-height:43px;display:flex;align-items:center;justify-content:center;background:#171d2a;border-bottom:1px solid var(--border);position:relative;color:#a8b3c5;font-size:12px;letter-spacing:.01em}
    .traffic{display:flex;position:absolute;left:17px;gap:8px}.dot{width:12px;height:12px;border-radius:50%;box-shadow:0 1px 0 #0004 inset}.red{background:#ff625b}.yellow{background:#febc2e}.green{background:#28c840}
    .titlebar .title{display:flex;align-items:center;gap:8px}.diamond{width:12px;height:12px;transform:rotate(45deg);border:2px solid #50a8fa;border-radius:2px}
    .titlebar .viewrepo{position:absolute;right:18px;font-size:11px;color:#91a2ba}.viewrepo:hover{color:#fff}
    .main{display:flex;min-height:0;flex:1}
    .activity{width:48px;flex:0 0 48px;background:#111722;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:18px;gap:21px}.activity .glyph{width:21px;height:21px;display:grid;place-items:center;color:#688098;opacity:.6;font-size:22px}.activity .glyph.selected{color:#dce9f7;opacity:1;position:relative}.activity .glyph.selected:before{content:'';position:absolute;left:-14px;width:2px;height:30px;border-radius:3px;background:var(--cyan)}
    .sidebar{width:233px;flex:0 0 233px;background:#141b27;border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}.side-heading{padding:16px 17px 15px;font-size:10px;color:#acb8cb;letter-spacing:.12em;font-weight:700}.folder{font-size:11px;padding:10px 14px;color:#bbc7d8;font-weight:700;border-top:1px solid #283242}.folder .arrow{color:#9cabc0;margin-right:7px}.folder .icon{color:#d6af77;margin-right:6px}.folder-label{font-size:11px;padding:10px 16px 7px;color:#8f9db1;letter-spacing:.06em}
    .project{width:100%;display:flex;gap:9px;align-items:center;text-align:left;border:0;border-left:2px solid transparent;background:transparent;padding:10px 10px 10px 25px;color:#9aa9bf;cursor:pointer;min-height:38px;transition:background .16s,color .16s}.project:hover{background:#243044;color:#eef7ff}.project.active{background:#263345;color:#e7efff;border-left-color:var(--cyan)}.fileico{font-size:13px;line-height:1;color:#89c2ff}.project .filename{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.project .pill{color:#718399;font-size:9px}
    .sidebar-bottom{margin-top:auto;padding:14px 16px;color:#71849c;font-size:11px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}.smallled{height:6px;width:6px;background:var(--green);border-radius:50%;box-shadow:0 0 8px #84dfb177}
    .work{display:flex;flex:1;min-width:0;min-height:0;flex-direction:column;background:#101620}.tabs{height:42px;min-height:42px;display:flex;background:#111924;border-bottom:1px solid var(--border);overflow:auto hidden;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-width:145px;max-width:235px;flex:0 1 auto;display:flex;align-items:center;gap:8px;padding:0 13px;background:#17202d;border-right:1px solid var(--border);color:#8b9aae;white-space:nowrap;cursor:pointer;border-top:2px solid transparent;min-height:40px}.tab.active{background:#101620;color:#e3edf9;border-top-color:var(--cyan)}.tab .name{overflow:hidden;text-overflow:ellipsis;flex:1;font-size:11px}.tab .md{color:#8bbafc;font-weight:700;font-size:10px}.tab .close{border:0;background:none;color:#8091a7;cursor:pointer;border-radius:4px;padding:1px 5px;font-size:17px;line-height:1.1}.tab .close:hover{color:#fff;background:#43546b}
    .crumbbar{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #1e2b3a;min-height:40px;padding:0 18px;color:#8190a4;font-size:11px}.crumbpath{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumbpath b{color:#b5c2d4;font-weight:500}.actions{display:flex;gap:10px;align-items:center;flex:0 0 auto}.tinybtn{background:none;border:1px solid #2c3c50;color:#b2c5dd;border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer}.tinybtn:hover{border-color:#6086ab;color:#fff}.tinybtn.selected{background:#233c50;border-color:#467ca1;color:#d6eeff}
    .editor{flex:1;overflow:auto;min-height:0;scrollbar-color:#37475b transparent;scrollbar-width:thin}.code{font:12px/1.8 "SFMono-Regular",Consolas,"Liberation Mono",monospace;white-space:pre;min-width:max-content;padding:16px 22px 28px 0}.line{display:flex;min-height:21px}.n{width:58px;flex:0 0 58px;text-align:right;padding-right:24px;color:#46576f;user-select:none}.l{padding-right:20px;color:#aebcce}.l.head{color:#86cfff;font-weight:600}.l.quote{color:#91a6bd}.l.fence{color:#bd9be8}.l.link{color:#b9d990}.l.bullet{color:#b7b4e7}.caret{display:inline-block;width:7px;height:17px;vertical-align:middle;background:#b6d6ed;animation:blink 1s step-end infinite;margin-left:2px}@keyframes blink{50%{opacity:0}}
    .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;color:#71849d;text-align:center;padding:15px}.empty .logo{font-family:monospace;font-size:58px;color:#29405c;font-weight:900;line-height:1}.empty strong{color:#afc0d4;font-size:14px}.empty span{max-width:340px;font-size:12px}
    .preview{padding:26px min(6%,50px) 44px;max-width:950px;font-size:13px;color:#c9d4e4;line-height:1.7}.preview h1,.preview h2,.preview h3{letter-spacing:-.02em;color:#e6eef9;line-height:1.25}.preview h1{font-size:27px;border-bottom:1px solid #2b3545;padding-bottom:13px}.preview h2{font-size:20px;margin-top:25px}.preview h3{font-size:16px}.preview p{margin:10px 0}.preview code{font-family:Consolas,monospace;background:#253143;color:#97d7e9;padding:2px 5px;border-radius:4px}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b121c;border:1px solid #283a51;border-radius:7px;padding:13px}.preview blockquote{border-left:3px solid #458db4;margin:13px 0;padding-left:14px;color:#a3b2c9}.preview li{margin:4px 0 4px 18px}.preview a{color:#8bdcff;text-decoration:underline}.preview hr{border:0;border-top:1px solid #263445}.preview .note{color:#74859a}
    .status{height:26px;min-height:26px;background:#123f60;border-top:1px solid #286086;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:10px;color:#d7efff}.status .left,.status .right{display:flex;gap:17px;align-items:center}.status .branch{color:#9ce4ff}
    @media(max-width:760px){body{padding:0}.window{height:100vh;border-radius:0;border:0}.activity{display:none}.sidebar{width:160px;flex-basis:160px}.project{padding-left:12px}.titlebar .viewrepo{display:none}.tab{min-width:110px}.n{width:39px;flex-basis:39px;padding-right:12px}.code{font-size:11px}.side-heading{padding-left:11px}}
    @media(max-width:430px){.sidebar{width:116px;flex-basis:116px}.project{gap:4px;padding-left:6px}.project .filename{font-size:10px}.project .pill{display:none}.folder{padding:10px 7px}.sidebar-bottom{font-size:9px;padding:10px}.crumbbar{padding:0 8px}.tinybtn{padding:3px 5px}.actions{gap:4px}.status .right{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="window" aria-label="Interactive macOS-style VS Code project explorer">
    <header class="titlebar"><div class="traffic" aria-hidden="true"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><div class="title"><span class="diamond" aria-hidden="true"></span> sanjay — Visual Studio Code</div><a class="viewrepo" href="https://github.com/sanjay-1458" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header>
    <div class="main">
      <aside class="activity" aria-hidden="true"><div class="glyph selected">▤</div><div class="glyph">⌕</div><div class="glyph">⑂</div><div class="glyph">⚙</div></aside>
      <nav class="sidebar" aria-label="Projects">
        <div class="side-heading">EXPLORER</div>
        <div class="folder"><span class="arrow">⌄</span><span class="icon">▣</span> SANJAY-THAKUR</div>
        <div class="folder-label">⌄ &nbsp; 📁 projects</div>
        <button class="project" data-project="volo" type="button"><span class="fileico">▤</span><span class="filename">VoloNexus.AI</span><span class="pill">MD</span></button>
        <button class="project" data-project="jobs" type="button"><span class="fileico">▤</span><span class="filename">Job-Finder</span><span class="pill">MD</span></button>
        <button class="project" data-project="blog" type="button"><span class="fileico">▤</span><span class="filename">AI-Blog-Application</span><span class="pill">MD</span></button>
        <div class="sidebar-bottom"><span class="smallled"></span> Exploring · 3 projects</div>
      </nav>
      <section class="work" aria-label="README editor">
        <div class="tabs" id="tabs" role="tablist" aria-label="Open project README files"></div>
        <div class="crumbbar"><div id="crumb" class="crumbpath">projects &gt; <b>README.md</b></div><div class="actions"><button type="button" class="tinybtn" id="viewmode" title="Toggle Markdown preview">Preview</button><a class="tinybtn" id="openrepo" href="https://github.com/sanjay-1458" target="_blank" rel="noopener noreferrer" title="Open repository on GitHub">Repo ↗</a></div></div>
        <div class="editor" id="editor" role="region" aria-label="File content" tabindex="0"></div>
      </section>
    </div>
    <footer class="status"><div class="left"><span class="branch">⑂ main*</span><span id="state">Ready</span></div><div class="right"><span>UTF-8</span><span>Markdown</span><span>⌘ W to close</span></div></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const projects = {
        volo: { name:'VoloNexus.AI', repo:'VoloNexus.AI', desc:'Autonomous scheduling across email and calendars', fallback:'# VoloNexus.AI\n\n> Autonomous AI scheduling system\n\nAI agents read emails, understand meeting intent, resolve calendar conflicts, and sync events across Google accounts.\n\n## Stack\n- NestJS · Next.js · MongoDB\n- Pinecone · Redis · Gemini\n\n## View full README\nOpen the GitHub repository with the Repo button.' },
        jobs: { name:'Job-Finder', repo:'Job-Finder', desc:'Multi-ATS job ingestion with LLM filtering', fallback:'# Job-Finder\n\n> AI job finder and referral automation\n\nCollects roles from Greenhouse, Lever and Workday, normalizes listings, and applies deterministic rules and LLM filtering.\n\n## Stack\n- Python · FastAPI · PostgreSQL\n- Redis · WebSockets · LLMs\n\n## View full README\nOpen the GitHub repository with the Repo button.' },
        blog: { name:'AI-Blog-Application', repo:'AI-Blog-Application', desc:'MERN blogging platform powered by Gemini', fallback:'# AI-Blog-Application\n\n> Generative AI blogging platform\n\nMERN-stack blog application with AI-assisted content generation powered by Google Gemini.\n\n## Stack\n- React · Node.js · MongoDB\n- Gemini\n\n## View full README\nOpen the GitHub repository with the Repo button.' }
      };
      const $ = (id) => document.getElementById(id);
      const tabsEl=$('tabs'), editor=$('editor'), state=$('state'), modeBtn=$('viewmode'), openRepo=$('openrepo');
      let openTabs=[], current=null, preview=false;
      const cache=new Map();
      const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
      const repoURL=(id)=>'https://github.com/sanjay-1458/'+projects[id].repo;
      function setState(msg){state.textContent=msg}
      function updateNav(){ document.querySelectorAll('.project').forEach(b=>{const active=b.dataset.project===current;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'true':'false')}); }
      function drawTabs(){ tabsEl.replaceChildren();for(const id of openTabs){ const p=projects[id]; const tab=el('div','tab'+(id===current?' active':''));tab.setAttribute('role','tab');tab.setAttribute('aria-selected',id===current?'true':'false');tab.tabIndex=0;
        const icon=el('span','md','M↓'),name=el('span','name',p.name),close=el('button','close','×');close.type='button';close.title='Close '+p.name;close.setAttribute('aria-label','Close '+p.name+' tab');close.addEventListener('click',(e)=>{e.stopPropagation();closeTab(id)});
        tab.append(icon,name,close);tab.addEventListener('click',()=>openProject(id));tab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProject(id)}});tabsEl.append(tab);}
      }
      function empty(){editor.replaceChildren();const d=el('div','empty'),logo=el('div','logo','◇'),title=el('strong','', 'No editors open'),hint=el('span','', 'Choose a project from the Explorer to open its README.md.');d.append(logo,title,hint);editor.append(d);$('crumb').textContent='projects';openRepo.href='https://github.com/sanjay-1458';setState('Ready');}
      function openProject(id){if(!projects[id])return;if(!openTabs.includes(id))openTabs.push(id);current=id;preview=false;modeBtn.textContent='Preview';modeBtn.classList.remove('selected');updateNav();drawTabs();renderCurrent();}
      function closeTab(id){const i=openTabs.indexOf(id);if(i===-1)return;openTabs.splice(i,1);if(current===id)current=openTabs[Math.min(i,openTabs.length-1)]||null;updateNav();drawTabs();if(current)renderCurrent();else empty();}
      async function load(id){if(cache.has(id))return cache.get(id);const p=projects[id];setState('Fetching README.md from GitHub…');
        try {const url='https://raw.githubusercontent.com/sanjay-1458/'+encodeURIComponent(p.repo)+'/main/README.md';const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw new Error('HTTP '+resp.status);const markdown=await resp.text();if(!markdown.trim())throw Error('Empty README');cache.set(id,{text:markdown,remote:true});}
        catch(err){cache.set(id,{text:p.fallback,remote:false});}
        return cache.get(id);
      }
      function colorFor(line){if(/^\s*#{1,6}\s/.test(line))return 'head';if(/^\s*>/.test(line))return 'quote';if(/^\s*```/.test(line))return 'fence';if(/^\s*[-*+]\s/.test(line))return 'bullet';if(/https?:\/\//.test(line))return 'link';return '';}
      function drawSource(markdown){const code=el('div','code');const fragment=document.createDocumentFragment();const lines=markdown.replace(/\r\n/g,'\n').split('\n');const max=1400;for(let i=0;i<Math.min(max,lines.length);i++){const row=el('div','line');row.append(el('span','n',String(i+1)),el('span','l '+colorFor(lines[i]),lines[i]||' '));fragment.append(row)}if(lines.length>max){fragment.append(el('div','line','… More content available in the repository.'))}code.append(fragment);editor.replaceChildren(code);}
      // Tiny safe Markdown preview (no dependencies, scripts or third-party renderers).
      function drawPreview(md){const box=el('div','preview');const lines=md.replace(/\r\n/g,'\n').split('\n');let code=null;
        const urlPattern=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
        function inline(n,s){let pos=0,match;urlPattern.lastIndex=0;while((match=urlPattern.exec(s))){if(match.index>pos)n.append(document.createTextNode(s.slice(pos,match.index)));const link=el('a','',match[1]);link.href=match[2];link.target='_blank';link.rel='noopener noreferrer';n.append(link);pos=urlPattern.lastIndex;}if(pos<s.length)n.append(document.createTextNode(s.slice(pos)));}
        for(const raw of lines.slice(0,1400)) {const line=raw.trim();if(line.startsWith('```')){if(code){code=null}else{const p=el('pre');code=el('code');p.append(code);box.append(p)}continue}if(code){code.textContent+=raw+'\n';continue}
          if(!line)continue;
          const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){box.append(el('h'+h[1].length,'',h[2].replace(/<[^>]+>/g,'')));continue}
          if(/^(-{3,}|\*{3,})$/.test(line)){box.append(el('hr'));continue}
          if(/^[*-] /.test(line)){const n=el('li');inline(n,line.slice(2));box.append(n);continue}
          if(/^>\s?/.test(line)){box.append(el('blockquote','',line.slice(1).trim()));continue}
          // HTML-heavy READMEs are displayed faithfully under the Source tab.
          if(/^<\/?[a-z][^>]*>$/i.test(line))continue;
          if(/^\|/.test(line))continue;
          const cleaned=line.replace(/<[^>]+>/g,'').trim();if(!cleaned)continue;const p=el('p');inline(p,cleaned);box.append(p);
        }
        const tip=el('p','note','Preview supports basic Markdown. Use Source for the complete original README (including embedded HTML).');box.append(tip);editor.replaceChildren(box);
      }
      async function renderCurrent(){const id=current;if(!id)return;const p=projects[id];$('crumb').textContent='';$('crumb').append(document.createTextNode('projects  ›  '+p.name+'  ›  '),el('b','', 'README.md'));openRepo.href=repoURL(id);
        const known=cache.get(id);if(known){preview?drawPreview(known.text):drawSource(known.text);setState(known.remote?'README.md · GitHub source':'Offline preview · Full README on GitHub');return}
        drawSource('# '+p.name+'\n\n> Loading the public README.md…');editor.scrollTop=0;const result=await load(id);if(current!==id)return;preview?drawPreview(result.text):drawSource(result.text);setState(result.remote?'README.md · GitHub source':'Offline preview · Full README on GitHub');editor.scrollTop=0;
      }
      document.querySelectorAll('.project').forEach(b=>b.addEventListener('click',()=>openProject(b.dataset.project)));
      modeBtn.addEventListener('click',()=>{if(!current)return;preview=!preview;modeBtn.textContent=preview?'Source':'Preview';modeBtn.classList.toggle('selected',preview);renderCurrent()});
      document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='w'){e.preventDefault();if(current)closeTab(current)}else if((e.metaKey||e.ctrlKey)&&['1','2','3'].includes(e.key)){e.preventDefault();openProject(['volo','jobs','blog'][Number(e.key)-1])}});
      // Load one tab by default. Sidebar opens/reuses tabs, × closes each tab.
      const selected = new URLSearchParams(window.location.search).get('project');
      openProject(selected && Object.hasOwn(projects, selected) ? selected : 'volo');
    })();
  </script>
</body>
